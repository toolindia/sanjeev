<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Sanjeev Dabla | Royal Estate Developers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- High-res export engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      /* Deep Luxury Matte Black Background Base */
      --bg-dark: #030406;
      --card-bg-1: #0f1115;
      --card-bg-2: #07090c;
      
      /* Premium Pure Foil Gold Gradient & Metallic Effects */
      --gold-foil: linear-gradient(135deg, #f7ecb5 0%, #d4af37 25%, #fff8dc 50%, #aa7c11 75%, #ebd373 100%);
      --gold-border: rgba(212, 175, 55, 0.5);
      
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-luxury: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      font-family: var(--font-sans);
    }

    .cards-deck {
      display: flex;
      flex-direction: column;
      gap: 3rem;
      align-items: center;
      width: 100%;
      max-width: 700px;
    }

    /* Fixed Aspect Ratio & Dimensions to Lock Layout */
    .card {
      width: 620px;
      height: 350px;
      min-width: 620px;
      min-height: 350px;
      background: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2));
      /* Authentic horizontal brushed matte texture simulation from physical card */
      background-image: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2)), 
                        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.45) 2px, rgba(0, 0, 0, 0.45) 3px);
      border: 1.5px solid var(--gold-border);
      border-radius: 12px;
      position: relative;
      padding: 2.2rem 2.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.98), inset 0 0 30px rgba(0, 0, 0, 0.7);
    }

    /* Elegant Double Inner Framing matching luxury stationery */
    .card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 8px;
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 13px;
      border: 1px solid rgba(212, 175, 55, 0.08);
      border-radius: 6px;
      pointer-events: none;
    }

    /* Pure Foiled Gold Typography & SVG Element Styling */
    .foil-gold {
      background: var(--gold-foil);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.95));
    }

    .gold-svg {
      fill: url(#goldGradient);
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.95));
    }

    /* FRONT SIDE RIGID LAYOUT (Exact match to sample structure) */
    .card-front {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 1.5rem;
      align-items: center;
      height: 100%;
      position: relative;
      z-index: 2;
    }

    .front-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding-top: 0.1rem;
      padding-bottom: 0.1rem;
    }

    .company-header-group {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .brand-title-main {
      font-family: var(--font-luxury);
      font-size: 1.95rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.05;
    }

    .brand-subtitle-main {
      font-family: var(--font-luxury);
      font-size: 0.55rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .services-tag {
      font-family: var(--font-luxury);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 0.15rem 0;
    }

    .services-subtag {
      font-family: var(--font-luxury);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #d4af37;
      text-transform: uppercase;
    }

    .contact-details-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.74rem;
      color: #e2e8f0;
      letter-spacing: 0.04em;
    }

    .contact-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      text-decoration: none;
      color: #e2e8f0;
      line-height: 1.35;
    }

    .contact-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    .front-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      border-left: 1px solid rgba(212, 175, 55, 0.25);
      padding-left: 1.5rem;
      text-align: center;
      padding-top: 0.1rem;
      padding-bottom: 0.1rem;
    }

    .crest-logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.95));
      border-radius: 50%;
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      background: #07090c;
      padding: 5px;
    }

    .person-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }

    .person-name {
      font-family: var(--font-luxury);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .person-phone {
      font-family: var(--font-luxury);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      margin-top: 0.05rem;
    }

    .person-role {
      font-family: var(--font-luxury);
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      color: #94a3b8;
      text-transform: uppercase;
    }


    /* BACK SIDE RIGID LAYOUT */
    .card-back {
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .back-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.95rem;
      width: 100%;
      height: 100%;
    }

    .crest-logo-large {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.98));
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.6);
      background: #07090c;
      padding: 6px;
    }

    .back-brand-title {
      font-family: var(--font-luxury);
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1;
    }

    .back-brand-sub {
      font-family: var(--font-luxury);
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-top: -0.2rem;
    }

    .tagline-script {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-top: 0.3rem;
    }


    /* Action buttons bar */
    .action-bar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }

    .btn {
      appearance: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-download {
      background: var(--gold-foil);
      color: #030406;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35);
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid var(--gold-border);
    }

    @media (max-width: 660px) {
      body { padding: 1rem 0.5rem; }
      .cards-deck { transform: scale(0.52); transform-origin: top center; margin-bottom: -180px; }
    }
  </style>
</head>
<body>

  <!-- SVG Global Gradient Definition for Pure Golden Vector Icons -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f7ecb5" />
        <stop offset="25%" stop-color="#d4af37" />
        <stop offset="50%" stop-color="#fff8dc" />
        <stop offset="75%" stop-color="#aa7c11" />
        <stop offset="100%" stop-color="#ebd373" />
      </linearGradient>
    </defs>
  </svg>

  <div class="cards-deck" id="cardDeckSheet">
    
    <!-- FRONT SIDE -->
    <div class="card">
      <div class="card-front">
        <div class="front-left">
          <div class="company-header-group">
            <div class="brand-title-main foil-gold">ROYAL ESTATE</div>
            <div class="brand-subtitle-main">DEVELOPERS</div>
          </div>

          <div>
            <div class="services-tag foil-gold">ARCHITECT & BUILDERS</div>
            <div class="services-subtag">SALE / PURCHASE / COLLABORATION</div>
          </div>

          <div class="contact-details-list">
            <a href="https://royalestatedevelopers.com" target="_blank" class="contact-row">
              <svg class="contact-icon gold-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="url(#goldGradient)" stroke-width="2"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="none" stroke="url(#goldGradient)" stroke-width="2"/></svg>
              <span class="foil-gold" style="-webkit-text-fill-color: initial; color: #f1f5f9; font-weight: 500; font-family: var(--font-luxury); letter-spacing: 0.08em;">royalestatedevelopers.com</span>
            </a>
            <div class="contact-row">
              <svg class="contact-icon gold-svg" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10" r="3" fill="none" stroke="url(#goldGradient)" stroke-width="2"/></svg>
              <span style="font-family: var(--font-luxury); letter-spacing: 0.06em; font-size: 0.72rem;">173, Lower Ground Floor, Kapil Vihar, Pitampura, Delhi-110034</span>
            </div>
          </div>
        </div>

        <div class="front-right">
          <img alt="Brand Crest Logo" class="crest-logo cors-safe-logo" />
          <div class="person-info-block">
            <div class="person-name foil-gold">Sanjeev Dabla</div>
            <a href="tel:+919818075525" class="person-phone foil-gold">+91 98180 75525</a>
          </div>
          <div class="person-role">Consultant</div>
        </div>
      </div>
    </div>

    <!-- BACK SIDE -->
    <div class="card">
      <div class="card-back">
        <div class="back-content">
          <img alt="Brand Crest Logo" class="crest-logo-large cors-safe-logo" />
          <div>
            <div class="back-brand-title foil-gold">ROYAL ESTATE</div>
            <div class="back-brand-sub">DEVELOPERS</div>
          </div>
          <div class="tagline-script foil-gold">Turning Dreams Into Reality</div>
        </div>
      </div>
    </div>

  </div>

  <div class="action-bar">
    <button class="btn btn-download" onclick="exportCardOptions()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Export Poster / Card...
    </button>

    <button class="btn btn-share" onclick="shareCard()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Share Card
    </button>
  </div>

  <script>
    const LOGO_URL = 'https://i.pinimg.com/736x/64/fa/1b/64fa1bd6848c8477903cf522f370ff71.jpg';
    let corsSafeLogoBase64 = null;

    window.addEventListener('load', () => {
      convertImgToBase64(LOGO_URL, (base64) => {
        corsSafeLogoBase64 = base64;
        document.querySelectorAll('.cors-safe-logo').forEach(img => {
          img.src = base64;
        });
      });
    });

    function convertImgToBase64(url, callback) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.referrerPolicy = 'no-referrer';
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = this.naturalHeight;
        canvas.width = this.naturalWidth;
        ctx.drawImage(this, 0, 0);
        callback(canvas.toDataURL('image/png'));
      };
      img.onerror = function() {
        img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
      }
      img.src = url;
    }

    async function generateCanvasSheet() {
      const sheet = document.getElementById('cardDeckSheet');
      if (!corsSafeLogoBase64) {
        alert("Logo is still loading. Please wait a moment.");
        return null;
      }
      return await html2canvas(sheet, {
        scale: 3, // Ultra high-resolution export
        useCORS: true,
        backgroundColor: '#030406',
        logging: false
      });
    }

    function exportCardOptions() {
      const choice = confirm("Choose export format:\n\nOK for Print-Ready PDF\nCancel for High-Res PNG Image");
      if (choice) {
        downloadPDF();
      } else {
        downloadPNG();
      }
    }

    async function downloadPNG() {
      const btn = document.querySelector('.btn-download');
      const originalHTML = btn.innerHTML;
      btn.innerText = 'Generating High-Res Image...';
      try {
        const canvas = await generateCanvasSheet();
        if (!canvas) return;
        const link = document.createElement('a');
        link.download = 'RoyalEstate_Sanjeev_Dabla_Card.png';
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error(err);
        alert('Could not export image.');
      } finally {
        btn.innerHTML = originalHTML;
      }
    }

    async function downloadPDF() {
      const btn = document.querySelector('.btn-download');
      const originalHTML = btn.innerHTML;
      btn.innerText = 'Generating PDF...';
      try {
        const canvas = await generateCanvasSheet();
        if (!canvas) return;
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const imgWidth = canvas.width;
        const imgHeight = canvas.height;
        const ratio = (pageWidth - 20) / imgWidth; 
        
        pdf.addImage(imgData, 'PNG', 10, 10, imgWidth * ratio, imgHeight * ratio);
        pdf.save('RoyalEstate_Sanjeev_Dabla_Card.pdf');
      } catch (err) {
        console.error(err);
        alert('Could not export PDF.');
      } finally {
        btn.innerHTML = originalHTML;
      }
    }

    async function shareCard() {
      const shareText = "Sanjeev Dabla | Architect & Builders\nRoyal Estate Developers\nPhone: +91 98180 75525\nWebsite: royalestatedevelopers.com\n173, Lower Ground Floor, Kapil Vihar, Pitampura, Delhi-110034";
      try {
        const canvas = await generateCanvasSheet();
        if (!canvas) return;
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], 'RoyalEstate_Card.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Sanjeev Dabla - Royal Estate Developers', text: shareText });
        } else {
          navigator.clipboard.writeText(shareText);
          alert("Card details copied to clipboard!");
        }
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    }
  </script>
</body>
</html>
