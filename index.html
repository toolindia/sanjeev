<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Rahul Sharma | Royal Estate Developers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Libraries for image and PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      /* Matte Black Brushed Metallic Texture Background */
      --bg-dark: #0f1115;
      --card-bg-1: #16191f;
      --card-bg-2: #0b0d11;
      
      /* Raised Foiled Gold Gradient & Effects */
      --gold-foil: linear-gradient(135deg, #dfbc55 0%, #fff1b0 30%, #c99e2e 50%, #fef3bd 70%, #b8860b 100%);
      --gold-solid: #d4af37;
      --gold-light: #f7e8b1;
      --border-gold: rgba(212, 175, 55, 0.4);
      
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: var(--font-sans);
    }

    .cards-deck {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      align-items: center;
      padding: 1.5rem;
    }

    /* Standard Business Card Dimensions Ratio (90mm x 55mm approx scaled) */
    .card {
      width: 540px;
      height: 310px;
      background: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2));
      /* Subtle brushed horizontal texture simulation */
      background-image: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2)), 
                        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, 0.25) 3px, rgba(0, 0, 0, 0.25) 4px);
      border: 1.5px solid var(--border-gold);
      border-radius: 12px;
      position: relative;
      padding: 1.8rem 2.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    /* Foiled / Embossed Text Utility */
    .foil-gold {
      background: var(--gold-foil);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1px 1px rgba(0, 0, 0, 0.8));
    }

    /* FRONT SIDE LAYOUT (Matching Image 1) */
    .card-front {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
    }

    .front-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding-right: 0.5rem;
    }

    .company-header-group {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .brand-title-main {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.1;
    }

    .brand-subtitle-main {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #b0bac5;
    }

    .services-tag {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin: 0.4rem 0;
    }

    .contact-details-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.76rem;
      color: #e2e8f0;
      letter-spacing: 0.02em;
    }

    .contact-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      text-decoration: none;
      color: #e2e8f0;
    }

    .contact-row span {
      line-height: 1.25;
    }

    .front-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      border-left: 1px solid rgba(212, 175, 55, 0.2);
      padding-left: 1.5rem;
      text-align: center;
    }

    .crest-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    .person-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }

    .person-name {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .person-phone {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
    }


    /* BACK SIDE LAYOUT (Matching Image 2 - Turning Dreams Into Reality) */
    .card-back {
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .back-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .crest-logo-large {
      width: 75px;
      height: 75px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    }

    .back-brand-title {
      font-family: var(--font-serif);
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1;
    }

    .back-brand-sub {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-top: -0.4rem;
    }

    /* Script Tagline matching card 2 */
    .tagline-script {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-top: 0.5rem;
    }


    /* Action buttons bar */
    .action-bar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .btn {
      appearance: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.95rem 1.8rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-download {
      background: var(--gold-foil);
      color: #080d16;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid var(--border-gold);
    }

    @media (max-width: 580px) {
      .card {
        width: 350px;
        height: 210px;
        padding: 1rem;
      }
      .brand-title-main { font-size: 1.15rem; }
      .services-tag { font-size: 0.8rem; }
      .contact-details-list { font-size: 0.58rem; }
      .crest-logo { width: 38px; height: 38px; }
      .person-name { font-size: 0.9rem; }
      .person-phone { font-size: 0.72rem; }
      .crest-logo-large { width: 50px; height: 50px; }
      .back-brand-title { font-size: 1.5rem; }
      .tagline-script { font-size: 1.25rem; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="cards-deck" id="cardDeckSheet">
    
    <!-- FRONT SIDE (Matching Image 1 layout & details) -->
    <div class="card" id="cardFront">
      <div class="front-left">
        <div class="company-header-group">
          <div class="brand-title-main foil-gold">ROYAL ESTATE</div>
          <div class="brand-subtitle-main">DEVELOPERS</div>
        </div>

        <div class="services-tag foil-gold">ARCHITECT & BUILDERS</div>
        <div style="font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; color: #d4af37; text-transform: uppercase;">SALE / PURCHASE / COLLABORATION</div>

        <div class="contact-details-list">
          <a href="tel:01131551755" class="contact-row">
            <span>📞</span> <span>011-31551755, 7043987634</span>
          </a>
          <a href="mailto:royalestatedevelopers@outlook.com" class="contact-row">
            <span>✉️</span> <span>royalestatedevelopers@outlook.com</span>
          </a>
          <div class="contact-row">
            <span>📍</span> <span>173, Lower Ground Floor, Kapil Vihar, Pitampura, Delhi-110034</span>
          </div>
        </div>
      </div>

      <div class="front-right">
        <img src="" alt="Crest Logo" class="crest-logo cors-safe-logo" />
        <div class="person-info-block">
          <div class="person-name foil-gold">Rahul Sharma</div>
          <a href="tel:+919818622267" class="person-phone foil-gold">9818622267</a>
        </div>
        <div style="font-size: 0.48rem; letter-spacing: 0.15em; color: #94a3b8; text-transform: uppercase;">Consultant</div>
      </div>
    </div>

    <!-- BACK SIDE (Matching Image 2 layout & tagline) -->
    <div class="card card-back" id="cardBack">
      <div class="back-content">
        <img src="" alt="Crest Logo" class="crest-logo-large cors-safe-logo" />
        <div>
          <div class="back-brand-title foil-gold">ROYAL ESTATE</div>
          <div class="back-brand-sub">DEVELOPERS</div>
        </div>
        <div class="tagline-script foil-gold">Turning Dreams Into Reality</div>
      </div>
    </div>

  </div>

  <div class="action-bar">
    <button class="btn btn-download" onclick="exportCardOptions()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Export Card...
    </button>

    <button class="btn btn-share" onclick="shareCard()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Share Card
    </button>
  </div>

  <script>
    // Using the exact crest logo URL from your previous configuration
    const LOGO_URL = 'https://i.pinimg.com/736x/64/fa/1b/64fa1bd6848c8477903cf522f370ff71.jpg';
    let corsSafeLogoBase64 = null;

    window.addEventListener('load', () => {
      convertImgToBase64(LOGO_URL, (base64) => {
        corsSafeLogoBase64 = base64;
        document.querySelectorAll('.cors-safe-logo').forEach(img => {
          img.src = base64;
        });
      });
    });

    function convertImgToBase64(url, callback) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.referrerPolicy = 'no-referrer';
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = this.naturalHeight;
        canvas.width = this.naturalWidth;
        ctx.drawImage(this, 0, 0);
        callback(canvas.toDataURL('image/png'));
      };
      img.onerror = function() {
        img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(url);
      }
      img.src = url;
    }

    async function generateCanvasSheet() {
      const sheet = document.getElementById('cardDeckSheet');
      if (!corsSafeLogoBase64) {
        alert("Logo is still loading. Please wait a moment.");
        return null;
      }
      return await html2canvas(sheet, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#0f1115',
        logging: false
      });
    }

    function exportCardOptions() {
      const choice = confirm("Choose export format:\n\nOK for PDF (Print Ready)\nCancel for Image (PNG)");
      if (choice) {
        downloadPDF();
      } else {
        downloadPNG();
      }
    }

    async function downloadPNG() {
      const btn = document.querySelector('.btn-download');
      const originalHTML = btn.innerHTML;
      btn.innerText = 'Generating Image...';
      try {
        const canvas = await generateCanvasSheet();
        if (!canvas) return;
        const link = document.createElement('a');
        link.download = 'Royal_Estate_Card_Rahul_Sharma.png';
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error(err);
        alert('Could not export image.');
      } finally {
        btn.innerHTML = originalHTML;
      }
    }

    async function downloadPDF() {
      const btn = document.querySelector('.btn-download');
      const originalHTML = btn.innerHTML;
      btn.innerText = 'Generating PDF...';
      try {
        const canvas = await generateCanvasSheet();
        if (!canvas) return;
        const imgData = canvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const imgWidth = canvas.width;
        const imgHeight = canvas.height;
        const ratio = (pageWidth - 20) / imgWidth; 
        
        pdf.addImage(imgData, 'PNG', 10, 10, imgWidth * ratio, imgHeight * ratio);
        pdf.save('Royal_Estate_Card_Rahul_Sharma.pdf');
      } catch (err) {
        console.error(err);
        alert('Could not export PDF.');
      } finally {
        btn.innerHTML = originalHTML;
      }
    }

    async function shareCard() {
      const shareText = "Rahul Sharma | Architect & Builders\nRoyal Estate Developers\nPhone: +91 9818622267\nAddress: 173, Lower Ground Floor, Kapil Vihar, Pitampura, Delhi-110034";
      try {
        const canvas = await generateCanvasSheet();
        if (!canvas) return;
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], 'RoyalEstate_Card.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Rahul Sharma - Royal Estate Developers', text: shareText });
        } else {
          navigator.clipboard.writeText(shareText);
          alert("Card details copied to clipboard!");
        }
      } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
      }
    }
  </script>
</body>
</html>
